<table [dataSource]="applicationDataSource" class="application-table" mat-table>
  <ng-container matColumnDef="jobTitle">
    <th *matHeaderCellDef mat-header-cell>Stelle</th>
    <td *matCellDef="let element" mat-cell>{{ element.jobTitle }}</td>
  </ng-container>

  <ng-container matColumnDef="employerName">
    <th *matHeaderCellDef mat-header-cell>Arbeitgeber</th>
    <td *matCellDef="let element" mat-cell>{{ element.employerName }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th *matHeaderCellDef mat-header-cell>Status</th>
    <td *matCellDef="let element" mat-cell>
      <app-status-badge [status]="element.status"></app-status-badge>
    </td>
  </ng-container>

  <ng-container matColumnDef="appliedAt">
    <th *matHeaderCellDef mat-header-cell>Beworben am</th>
    <td *matCellDef="let element" mat-cell>{{ element.appliedAt | date:'dd.MM.yyyy' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th *matHeaderCellDef mat-header-cell>Aktionen</th>
    <td *matCellDef="let element" mat-cell>
      <button (click)="withdraw(element)" color="warn" mat-button type="button">
        <mat-icon>delete</mat-icon>
        Zurückziehen
      </button>
    </td>
  </ng-container>

  <tr *matHeaderRowDef="columns" mat-header-row></tr>
  <tr *matRowDef="let row; columns: columns;" mat-row></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10]" [pageSize]="10" showFirstLastButtons></mat-paginator>
